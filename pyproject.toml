[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "codeviewx"
version = "0.2.9"
description = "AI-powered code documentation generator based on DeepAgents and LangChain"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "CodeViewX Team"}
]
keywords = [
    "documentation", 
    "ai", 
    "code-analysis", 
    "deepagents", 
    "langchain",
    "code-documentation",
    "document-generation"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Console",
]

dependencies = [
    "deepagents>=0.6.0,<0.7.0",
    "langchain-core>=1.4.0,<2.0.0",
    "Pygments==2.19.2",
    "PyYAML==6.0.3",
    "requests==2.32.5",
    "requests-toolbelt==1.0.0",
    "flask>=2.0.0",
    "markdown>=3.4.0",
    "pymdown-extensions>=10.5",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "isort>=5.0",
    "build>=0.10.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/dean2021/codeviewx"
Documentation = "https://github.com/dean2021/codeviewx/tree/main/docs"
Repository = "https://github.com/dean2021/codeviewx"
"Bug Tracker" = "https://github.com/dean2021/codeviewx/issues"

[project.scripts]
codeviewx = "codeviewx.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["codeviewx*"]
exclude = ["tests*", "docs*", "examples*", "tools", "prompt"]

[tool.setuptools.package-data]
codeviewx = [
    "prompts/*.md",
    "tpl/*.html",
    "static/**/*"
]

[tool.black]
line-length = 100
target-version = ['py311']
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v"
